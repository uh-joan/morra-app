<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="Two input channels, camera to MediaPipe hand landmarking and microphone to vosk speech recognition, converge on a sync window where hand and voice must co-occur for the throw to count; the rival's move is cryptographically committed before the throw and resolves against it.">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  </defs>
  <rect x="10" y="36" width="110" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="65" y="62" text-anchor="middle" font-size="12" fill="#e6edf3">Camera</text>
  <line x1="120" y1="58" x2="154" y2="58" stroke="#8b949e" stroke-width="1.25" marker-end="url(#m)"/>
  <rect x="160" y="28" width="210" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="265" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">MediaPipe HandLandmarker</text>
  <text x="265" y="70" text-anchor="middle" font-size="10.5" fill="#8b949e">counts your fingers</text>
  <rect x="10" y="152" width="110" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="65" y="178" text-anchor="middle" font-size="12" fill="#e6edf3">Microphone</text>
  <line x1="120" y1="174" x2="154" y2="174" stroke="#8b949e" stroke-width="1.25" marker-end="url(#m)"/>
  <rect x="160" y="144" width="210" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="265" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">vosk, in Catalan</text>
  <text x="265" y="186" text-anchor="middle" font-size="10.5" fill="#8b949e">hears your call</text>
  <line x1="370" y1="58" x2="424" y2="102" stroke="#8b949e" stroke-width="1.25" marker-end="url(#m)"/>
  <line x1="370" y1="174" x2="424" y2="138" stroke="#8b949e" stroke-width="1.25" marker-end="url(#m)"/>
  <text x="386" y="86" text-anchor="middle" font-size="10" fill="#8b949e">finger count</text>
  <text x="386" y="162" text-anchor="middle" font-size="10" fill="#8b949e">number heard</text>
  <rect x="430" y="72" width="160" height="96" rx="8" fill="#3a201b" stroke="#e56a58" stroke-width="1.5"/>
  <text x="510" y="102" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">Sync window</text>
  <text x="510" y="122" text-anchor="middle" font-size="10.5" fill="#8b949e">hand + voice</text>
  <text x="510" y="138" text-anchor="middle" font-size="10.5" fill="#8b949e">must co-occur</text>
  <line x1="590" y1="120" x2="624" y2="120" stroke="#8b949e" stroke-width="1.25" marker-end="url(#m)"/>
  <rect x="630" y="96" width="120" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="690" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">Throw counts</text>
  <rect x="430" y="212" width="230" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="545" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="#e6edf3">Rival's move, sealed</text>
  <text x="545" y="252" text-anchor="middle" font-size="10.5" fill="#8b949e">cryptographically committed</text>
  <text x="545" y="267" text-anchor="middle" font-size="10.5" fill="#8b949e">before you throw</text>
  <line x1="600" y1="212" x2="676" y2="150" stroke="#8b949e" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#m)"/>
  <text x="662" y="196" text-anchor="start" font-size="10" fill="#8b949e">resolves</text>
</svg>